<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vitrine remote subresource qualification</title>
    <style>
      :root { font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: white; }
      #status { width: min(38rem, 80vw); padding: 3rem; border-radius: 1.5rem; background: #92400e; }
      #status.blocked { background: #065f46; }
      #status.loaded { background: #991b1b; }
      #probe { width: 1px; height: 1px; opacity: 0.01; }
    </style>
  </head>
  <body>
    <main id="status">REMOTE_PENDING</main>
    <img
      id="probe"
      src="https://example.com/favicon.ico"
      alt="remote probe"
      onerror="document.getElementById('status').className='blocked';document.getElementById('status').textContent='REMOTE_BLOCKED'"
      onload="document.getElementById('status').className='loaded';document.getElementById('status').textContent='REMOTE_LOADED — FAIL'"
    >
  </body>
</html>
