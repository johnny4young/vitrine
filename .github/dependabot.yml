# Keep GitHub Actions dependencies current. The release workflow
# holds the signing, notarization, Sparkle, and license secrets, so the actions
# it runs are supply-chain-sensitive. Dependabot proposes bumps as PRs that run
# the full CI gate before merging; it also keeps commit-SHA pins fresh once the
# `uses:` references stay pinned to immutable commit SHAs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    groups:
      site-dependencies:
        patterns: ["*"]
    # `@astrojs/check` declares `peer typescript@"^5.0.0 || ^6.0.0"`, so a TypeScript
    # major bump fails `npm ci` with ERESOLVE in the Linux static-check job. Because a
    # single group covers every package here, that one incompatible major also blocks
    # the safe astro/wrangler bumps and any queued security fix riding the same tree.
    # Minor and patch TypeScript updates still flow. Remove this entry once
    # `@astrojs/check` widens its peer range to accept the next major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
