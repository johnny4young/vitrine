# Keep GitHub Actions dependencies current. The release workflow
# holds the signing, notarization, Sparkle, and license secrets, so the actions
# it runs are supply-chain-sensitive. Dependabot proposes bumps as PRs that run
# the full CI gate before merging; it also keeps commit-SHA pins fresh once the
# `uses:` references stay pinned to immutable commit SHAs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    groups:
      # Security fixes get their own group. With one group covering every update, a
      # single incompatible version bump — the TypeScript major ignored below is the
      # standing example — held back any security fix riding in the same pull request.
      # Splitting by `applies-to` lets a security update land on its own.
      site-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      site-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    # `@astrojs/check` declares `peer typescript@"^5.0.0 || ^6.0.0"`, so a TypeScript
    # major bump fails `npm ci` with ERESOLVE in the Linux static-check job. Because one
    # group covers every version update here, that one incompatible major also blocks the
    # safe astro/wrangler bumps grouped with it; security fixes have their own group.
    # Minor and patch TypeScript updates still flow. Remove this entry once
    # `@astrojs/check` widens its peer range to accept the next major.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
