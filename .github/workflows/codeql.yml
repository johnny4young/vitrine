name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            label: JavaScript and TypeScript
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            label: Swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    # The Swift database build traces a full app+CLI compile and normally takes
    # 33-45 minutes on hosted runners, but a slow runner has crossed 60 twice
    # (PRs #150 and #151), killing the job before analysis with nothing to show.
    # 90 keeps a real hang bounded while leaving the observed tail room to finish.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export DEVELOPER_DIR
        if: matrix.language == 'swift'
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        if: matrix.language == 'swift'
        run: ./scripts/install-xcodegen.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Swift extraction traces the same generated-project Debug build developers
      # use. JavaScript/TypeScript is interpreted and needs no manual build step.
      # The traced build is bimodal on hosted runners: ~40 minutes most of the time,
      # but some jobs never finish inside 60 or 90 minutes on identical code. A job-level
      # timeout kills everything and leaves no log to read. Bound the STEP instead, so a
      # stuck extraction still hands its logs to the upload below.
      - name: Build Swift database
        if: matrix.language == 'swift'
        timeout-minutes: 75
        run: make build

      # Preserve the extractor's own logs whether the build finished, failed, or was
      # stopped by the step timeout — the only way to see where a slow run stalls.
      - name: Upload CodeQL Swift extraction logs
        if: always() && matrix.language == 'swift'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codeql-swift-extraction-logs
          path: |
            ${{ runner.temp }}/codeql_databases/**/log/**
            ${{ runner.temp }}/codeql_databases/**/diagnostic/**
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: /language:${{ matrix.language }}
