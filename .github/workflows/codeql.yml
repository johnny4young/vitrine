name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            label: JavaScript and TypeScript
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            label: Swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export DEVELOPER_DIR
        if: matrix.language == 'swift'
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        if: matrix.language == 'swift'
        run: ./scripts/install-xcodegen.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Swift extraction traces the same generated-project Debug build developers
      # use. JavaScript/TypeScript is interpreted and needs no manual build step.
      - name: Build Swift database
        if: matrix.language == 'swift'
        run: make build

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: /language:${{ matrix.language }}
