name: CodeQL security analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 4"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            label: JavaScript and TypeScript
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            label: Swift
            runner: macos-15
            build-mode: manual
    runs-on: ${{ matrix.runner }}
    # The Swift database build traces a full app+CLI compile and normally takes
    # 33-45 minutes on hosted runners, but a slow runner has crossed 60 twice
    # (PRs #150 and #151), killing the job before analysis with nothing to show.
    # 90 keeps a real hang bounded while leaving the observed tail room to finish.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        if: matrix.language == 'swift'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export DEVELOPER_DIR
        if: matrix.language == 'swift'
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        if: matrix.language == 'swift'
        run: ./scripts/install-xcodegen.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Swift extraction traces the same generated-project Debug build developers
      # use. JavaScript/TypeScript is interpreted and needs no manual build step.
      # The traced build is bimodal on hosted runners: ~40 minutes most of the time,
      # but some jobs never finish inside 60 or 90 minutes on identical code. A job-level
      # timeout kills everything and leaves no log to read. Bound the STEP instead, so a
      # stuck extraction still hands its logs to the upload below.
      # The 75-minute limit is the outer bound. Inside it, a watchdog distinguishes a
      # SLOW build from a STALLED one. Evidence from stalled runs: xcodebuild's own
      # stdout goes silent at "EmitSwiftModule … Vitrine" for the rest of the budget
      # (50 minutes observed), so the build's output is the progress signal. The
      # earlier design watched file activity under the CodeQL database instead, and
      # was defeated by itself: the tracer intercepted the watchdog's own `sleep` and
      # `find`, appending ~28 lines to build-tracer.log per tick, so the directory
      # never looked idle. The watchdog therefore runs its commands with the tracer
      # variables cleared — they are neither traced nor logged — and on a stall kills
      # the whole build tree, including the extractor processes that otherwise
      # survive a step timeout and wedge every later step.
      - name: Build Swift database
        if: matrix.language == 'swift'
        timeout-minutes: 75
        run: |
          set -o pipefail
          untraced() { env DYLD_INSERT_LIBRARIES= SEMMLE_PRELOAD_libtrace= CODEQL_RUNNER= "$@"; }
          build_log="$RUNNER_TEMP/codeql-build.log"
          : > "$build_log"
          (make build 2>&1 | tee "$build_log") & build=$!
          last_size=0; quiet=0
          while kill -0 "$build" 2>/dev/null; do
            untraced sleep 60
            size="$(untraced stat -f %z "$build_log" 2>/dev/null || echo 0)"
            if [ "$size" != "$last_size" ]; then last_size="$size"; quiet=0; else quiet=$((quiet + 1)); fi
            if [ "$quiet" -ge 15 ]; then
              echo "::error::STALLED: no CodeQL extraction activity for 15 minutes (xcodebuild output silent since its last line below); killing the build."
              untraced tail -n 5 "$build_log"
              untraced pkill -TERM -f 'extractor.real|swift-frontend|xcodebuild' 2>/dev/null
              untraced pkill -TERM -P "$build" 2>/dev/null; kill -TERM "$build" 2>/dev/null
              untraced sleep 5
              untraced pkill -KILL -f 'extractor.real|swift-frontend|xcodebuild' 2>/dev/null
              untraced pkill -KILL -P "$build" 2>/dev/null; kill -KILL "$build" 2>/dev/null
              wait "$build" 2>/dev/null
              exit 124
            fi
          done
          wait "$build"

      # Diagnostics for a stalled run. Lessons from three failed attempts: a Node
      # action inherits the tracer injection and dies silently; a bash step tolerates
      # the injection only while the tracer is healthy; and after a build-step
      # timeout three orphaned `extractor.real` processes keep the tracer wedged, so
      # even `ls` and `cp` on the database directory can block until the job limit.
      # So: run with the tracer variables cleared, kill the orphans first, write the
      # cheapest and most valuable evidence before anything else, and bound every
      # command individually so no single hang can consume the step.
      - name: Summarize CodeQL Swift extraction
        if: always() && matrix.language == 'swift'
        timeout-minutes: 5
        env:
          DYLD_INSERT_LIBRARIES: ""
          SEMMLE_PRELOAD_libtrace: ""
          CODEQL_RUNNER: ""
        run: |
          set +e
          bounded() { perl -e 'alarm shift; exec @ARGV' "$@"; }   # bounded <seconds> <command…>
          pkill -KILL -f 'extractor.real|swift-frontend|xcodebuild' 2>/dev/null && echo "killed orphaned build/extractor processes"
          db="$RUNNER_TEMP/codeql_databases"
          stage="$RUNNER_TEMP/codeql-swift-diagnostics"; mkdir -p "$stage"
          echo "host arch: $(uname -m)"
          echo "--- last 20 xcodebuild lines ---"
          bounded 20 tail -n 20 "$RUNNER_TEMP/codeql-build.log" 2>/dev/null | tee "$stage/build-tail.log"
          echo "--- last 60 tracer lines ---"
          bounded 30 tail -n 60 "${CODEQL_TRACER_LOG:-$db/log/build-tracer.log}" 2>/dev/null | tee "$stage/tracer-tail.log"
          # Per-language extractor logs are the evidence for a stall (codeql_databases/*/log);
          # the tracer log is the largest file, so it is staged last and only if time allows.
          for rel in swift/log swift/diagnostic diagnostic log; do
            [ -d "$db/$rel" ] || continue
            mkdir -p "$stage/$rel"
            bounded 60 tar -C "$db/$rel" -cf - . 2>/dev/null | bounded 60 tar -C "$stage/$rel" -xf - 2>/dev/null
          done
          echo "--- staged for upload ---"; bounded 20 find "$stage" -type f | head -40
          exit 0

      - name: Upload CodeQL Swift extraction logs
        if: always() && matrix.language == 'swift'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        env:
          DYLD_INSERT_LIBRARIES: ""
          SEMMLE_PRELOAD_libtrace: ""
          CODEQL_RUNNER: ""
        with:
          name: codeql-swift-extraction-logs
          path: ${{ runner.temp }}/codeql-swift-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Analyze
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: /language:${{ matrix.language }}
