name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated stable tag to promote (for example v1.1.0)"
        required: true
        type: string
      candidate_run_id:
        description: "Successful tag-triggered Release workflow run ID"
        required: true
        type: string
      expected_sha256:
        description: "DMG SHA-256 copied from the candidate run summary"
        required: true
        type: string
      qa_confirmation:
        description: "Type CLEAN-MAC-QA-PASSED after completing the external checklist"
        required: true
        type: string

# Default the workflow token to read-only. The tag-triggered candidate jobs only
# add attestation access; the manual `publish` job elevates exactly the scopes it
# needs after validating the successful candidate run and its DMG digest.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Release gate: the same lint/Debug+Release-build/test/UI-test-build checks CI runs
  # on every PR, re-run against the tagged commit. `candidate` needs this job, so
  # a tag cannot even produce a promotable DMG when a gate fails.
  verify:
    name: Verify (lint, Debug/Release builds, UI-test build, test)
    if: github.event_name == 'push'
    runs-on: macos-latest
    # Cap well under the 6-hour default so a wedged SPM resolve or hung
    # xcodebuild surfaces in minutes on the tag run.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The release gate validates that the pushed ref is an annotated tag.
          # Fetch the tag object rather than only its peeled commit.
          fetch-depth: 0

      # Version guard: Sparkle decides "is this newer?" from the bundle's
      # CFBundleVersion, so tagging a release without bumping project.yml publishes
      # a DMG that self-identifies as the previous version and an appcast that never
      # offers it as an update (v0.2.0 shipped this way, advertising 0.1.0/build 1).
      # Refuse to publish when the tag and MARKETING_VERSION disagree, or when the
      # bundled What's New notes lack an entry for the tagged version (release
      # checklist, docs/RELEASING.md).
      - name: Verify tag matches project version
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} is not a stable v-prefixed SemVer tag."
            exit 1
          fi
          TAG_OBJECT_TYPE="$(git cat-file -t "${GITHUB_REF_NAME}")"
          if [ "${TAG_OBJECT_TYPE}" != "tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} is lightweight; create it with git tag -a so the release has durable tag metadata."
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MARKETING_VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][0-9A-Za-z.\-]*)"?[[:space:]]*$/\1/p' project.yml | head -n1)"
          if [ "${TAG_VERSION}" != "${MARKETING_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match MARKETING_VERSION ${MARKETING_VERSION} in project.yml — bump the version (and CURRENT_PROJECT_VERSION) before tagging."
            exit 1
          fi
          if ! grep -q "version: \"${TAG_VERSION}\"" Vitrine/Help/ReleaseNotes.swift; then
            echo "::error::Vitrine/Help/ReleaseNotes.swift has no entry for ${TAG_VERSION} — add the What's New note (newest first) before tagging."
            exit 1
          fi
          echo "Tag v${TAG_VERSION} matches project.yml and has bundled release notes." >> "$GITHUB_STEP_SUMMARY"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Toolchain versions
        run: |
          {
            echo "### Release toolchain"
            echo '```'
            echo "Tag: ${GITHUB_REF_NAME}"
            echo "Image: ${ImageOS:-unknown} (${ImageVersion:-unknown})"
            sw_vers
            xcodebuild -version
            swift --version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install pinned XcodeGen
        run: ./scripts/install-xcodegen.sh

      - name: CHANGELOG matches the tagged version
        run: make changelog-check

      - name: Cache Swift Package Manager
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Lint (swift-format)
        run: make lint

      - name: Build (Debug)
        run: make build RESULT_BUNDLE="${RUNNER_TEMP}/build.xcresult"

      - name: Build (universal Release)
        run: make build-release RESULT_BUNDLE="${RUNNER_TEMP}/build-release.xcresult"

      - name: Build UI tests
        run: make build-ui-tests RESULT_BUNDLE="${RUNNER_TEMP}/build-ui-tests.xcresult"

      - name: Test (Swift Testing)
        run: make test RESULT_BUNDLE="${RUNNER_TEMP}/test.xcresult"

      # Upload diagnostics if the gate fails so a release blocked by a regression
      # can be triaged from the tag run itself.
      - name: Upload .xcresult bundles
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-verify-xcresults
          path: |
            ${{ runner.temp }}/build.xcresult
            ${{ runner.temp }}/build-release.xcresult
            ${{ runner.temp }}/build-ui-tests.xcresult
            ${{ runner.temp }}/test.xcresult
          if-no-files-found: ignore

  candidate:
    name: Build signed release candidate
    if: github.event_name == 'push'
    needs: verify
    outputs:
      version: ${{ steps.checksum.outputs.version }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    runs-on: macos-latest
    # Notarization (`notarytool submit --wait`, twice: app + DMG) can stall on
    # Apple-side outages; cap the job instead of waiting out the 6-hour default.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install pinned XcodeGen
        run: ./scripts/install-xcodegen.sh

      # A release candidate is intentionally stricter than a local/fork DMG build.
      # `build-dmg.sh` retains its ad-hoc fallback for local development, but a tag
      # must never produce a candidate that lacks Developer ID signing, Apple
      # notarization, the Sparkle signer, or production PRO activation.
      - name: Require production release secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_KEY_ISSUER_ID }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          VITRINE_LICENSE_SIGNING_KEY: ${{ secrets.VITRINE_LICENSE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_CODE_SIGN_IDENTITY \
            MACOS_NOTARY_TEAM_ID \
            SPARKLE_EDDSA_PRIVATE_KEY \
            VITRINE_LICENSE_SIGNING_KEY
          do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done

          api_key_complete=false
          if [ -n "${MACOS_NOTARY_KEY_ID:-}" ] \
            && [ -n "${MACOS_NOTARY_KEY_ISSUER_ID:-}" ] \
            && [ -n "${MACOS_NOTARY_KEY_P8:-}" ]; then
            api_key_complete=true
          fi
          apple_id_complete=false
          if [ -n "${MACOS_NOTARY_APPLE_ID:-}" ] \
            && [ -n "${MACOS_NOTARY_PASSWORD:-}" ]; then
            apple_id_complete=true
          fi
          if [ "${api_key_complete}" != true ] && [ "${apple_id_complete}" != true ]; then
            missing+=("complete notarization credentials")
          fi

          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Release candidate is missing required secret: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Production signing, notarization, update, and activation inputs are configured." >> "$GITHUB_STEP_SUMMARY"

      # Import the Developer ID Application certificate into a temporary keychain
      # so `codesign` can find it during the build. The preflight above makes a
      # missing credential fatal before any packaging work begins.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "::error::Developer ID certificate disappeared after release preflight."
            exit 1
          fi
          KEYCHAIN="${RUNNER_TEMP}/vitrine-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          umask 077
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 --decode > "${CERT_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT_PATH}" -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          # Allow codesign to use the imported key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          # Put our keychain on the search list so codesign sees the identity.
          security list-keychains -d user -s "${KEYCHAIN}" "$(security default-keychain -d user | tr -d ' "')"
          rm -f "${CERT_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN}"

      # Stage the App Store Connect API private key (.p8) from a secret, if
      # provided. This is the preferred notarization credential for CI because it
      # avoids an app-specific password. Skipped when the secret is absent, leaving
      # the Apple-ID credential path (or no notarization) intact.
      - name: Stage App Store Connect API key
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_NOTARY_KEY_P8:-}" ]; then
            echo "App Store Connect API key secret not configured; skipping key staging."
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
          umask 077
          printf '%s' "${MACOS_NOTARY_KEY_P8}" | base64 --decode > "${KEY_PATH}"
          echo "MACOS_NOTARY_KEY_P8=${KEY_PATH}" >> "$GITHUB_ENV"

      # Signing + notarization are gated inside build-dmg.sh on these env vars; the
      # build degrades to an unsigned, ad-hoc DMG when they are unset. The
      # script signs with the hardened runtime, notarizes with whichever credential
      # style is present (App Store Connect API key preferred over Apple ID),
      # staples, then runs `codesign --verify --deep --strict --verbose=2` and
      # `spctl -a -vv` before the candidate can be uploaded.
      - name: Build DMG
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.MACOS_CODE_SIGN_IDENTITY }}
          MACOS_SIGN_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_KEY_ISSUER_ID }}
          # PRO direct-download license-signing private key (embedded-key activation model).
          # XcodeGen interpolates it into the VitrineLicenseSigningKey Info.plist value
          # (project.yml), so the release DMG can mint + sign activation tokens. Unset →
          # empty → LicenseSigningKey.embedded is nil and the build stays free (a fork or a
          # PR build never gets it). The matching public key is committed in source. The value
          # is a GitHub Actions secret, masked in logs and never echoed by build-dmg.sh.
          VITRINE_LICENSE_SIGNING_KEY: ${{ secrets.VITRINE_LICENSE_SIGNING_KEY }}
        run: ./scripts/build-dmg.sh

      # Drop the imported signing identity the moment signing is done: none of the
      # later steps (checksum, appcast, release upload, tap, Pages) need it, and
      # third-party actions run after this point. `always()` so a failed build
      # never leaves the unlocked keychain behind for the rest of the job either.
      - name: Clean up signing keychain
        if: ${{ always() }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/vitrine-signing.keychain-db"
          if [ -f "${KEYCHAIN}" ]; then
            security list-keychains -d user -s "$(security default-keychain -d user | tr -d ' "')" || true
            security delete-keychain "${KEYCHAIN}" || true
            echo "Temporary signing keychain removed and search list restored."
          fi

      # Compute, print, and store the DMG SHA-256 so the Homebrew cask can be
      # bumped without re-downloading the artifact. The checksum is
      # written to the job summary (printed), saved as a `.sha256` sidecar that
      # ships as a release asset (stored), and emitted as a ready-to-paste cask
      # `version`/`sha256` block to make the tap update a copy-paste — see
      # docs/RELEASING.md. `build-dmg.sh` already prints the same checksum; this
      # step is what persists it.
      - name: Compute and store DMG SHA-256
        id: checksum
        run: |
          set -euo pipefail
          # The DMG name is produced by build-dmg.sh as Vitrine-<version>.dmg.
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/Vitrine-${VERSION}.dmg"
          SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # Keep only the artifact basename in the sidecar so a user can download the
          # DMG and checksum into any directory and run `shasum -a 256 -c` directly.
          printf '%s  %s\n' "${SHA256}" "$(basename "${DMG}")" > "${DMG}.sha256"
          # Ready-to-paste cask stanza values for the tap update.
          {
            echo "version \"${VERSION}\""
            echo "sha256 \"${SHA256}\""
          } > dist/vitrine-cask-update.txt
          # Expose to later steps and the public step outputs.
          {
            echo "version=${VERSION}"
            echo "sha256=${SHA256}"
            echo "dmg=${DMG}"
          } >> "$GITHUB_OUTPUT"
          # Print to the run summary so the value is visible without downloading.
          {
            echo "### DMG checksum"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Artifact | \`$(basename "$DMG")\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| SHA-256 | \`${SHA256}\` |"
            echo ""
            echo "Homebrew cask update (paste into \`Casks/vitrine.rb\` in the tap):"
            echo '```ruby'
            echo "version \"${VERSION}\""
            echo "sha256 \"${SHA256}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Sparkle auto-update appcast. Sign the DMG with Sparkle's EdDSA tool and
      # (re)generate the signed appcast.xml so direct-download users update from version
      # N to N+1 without a manual reinstall. It stays inside the private candidate
      # artifact until manual promotion deploys it to the production SUFeedURL.
      # The preflight makes the EdDSA key mandatory for tag candidates; the private
      # half of SUPublicEDKey never leaves the secret context.
      - name: Generate signed Sparkle appcast
        id: appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          # The release notes URL Sparkle shows for this version (the GitHub release page).
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "::error::Sparkle EdDSA key disappeared after release preflight."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"

          # Fetch Sparkle's binary tools (generate_appcast, which signs each entry with the
          # EdDSA key). Pinned to the same version the app embeds from Vendor/ (fetched and
          # checksum-verified by scripts/fetch-sparkle.sh) so the appcast format matches the
          # runtime. The tarball is checksum-verified here too — this binary receives the
          # EdDSA private key on stdin, so it must never run unverified. The version and
          # sha256 come from the single shared pin in scripts/sparkle-version.env, so the
          # app framework and the appcast tooling can never drift apart.
          # shellcheck disable=SC1091
          source scripts/sparkle-version.env
          curl -fsSL -o "${RUNNER_TEMP}/Sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_TARBALL_SHA256}  ${RUNNER_TEMP}/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "${RUNNER_TEMP}/sparkle"
          tar -xf "${RUNNER_TEMP}/Sparkle.tar.xz" -C "${RUNNER_TEMP}/sparkle"
          GENERATE_APPCAST="${RUNNER_TEMP}/sparkle/bin/generate_appcast"

          # generate_appcast reads every archive in a folder and writes appcast.xml beside
          # them, signing each entry with the EdDSA key. The private key is fed on STDIN via
          # `--ed-key-file -` (Sparkle's recommended CI form), so it never touches disk and
          # is never echoed to the log. Point the tool at dist/ (which holds the built DMG);
          # --download-url-prefix makes each item's enclosure URL the release's DMG asset.
          printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" | "${GENERATE_APPCAST}" --ed-key-file - \
            --download-url-prefix "${{ github.server_url }}/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/" \
            --link "${RELEASE_URL}" \
            dist/

          # Builds before the one that added SUEnableInstallerLauncherService cannot
          # install anything: sandboxed, they never reach Sparkle's Installer XPC
          # service and fail with "An error occurred while launching the installer."
          # Shipping a fixed build does not repair them, because the updater doing the
          # work is the broken one already on disk. Marking the entry informational for
          # exactly those hosts turns their alert into a download link — the only route
          # left to that installed base. Newer hosts are unaffected and install in place.
          # Runs before the appcast is staged or attached, so every published copy
          # carries the marker. It rewrites XML only; each enclosure's EdDSA signature
          # covers the DMG bytes and is preserved verbatim.
          python3 scripts/mark-informational-update.py dist/appcast.xml

          echo "generated=true" >> "$GITHUB_OUTPUT"

          {
            echo "### Sparkle appcast"
            echo ""
            echo "Signed appcast generated for \`${VERSION}\` and held in the candidate artifact."
            echo "Manual promotion attaches it to the release and deploys the exact bytes to the production feed."
          } >> "$GITHUB_STEP_SUMMARY"

      # Signed build provenance for the DMG:
      # GitHub's first-party attestation records which workflow run, on which
      # commit, produced these exact bytes. Anyone can verify a download with:
      #   gh attestation verify Vitrine-<version>.dmg --repo <owner>/vitrine
      - name: Attest DMG build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*.dmg

      - name: Generate SPDX dependency inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: build/Build/Products/Release/Vitrine.app
          format: spdx-json
          syft-version: v1.49.0
          output-file: dist/Vitrine-${{ steps.checksum.outputs.version }}.spdx.json
          artifact-name: Vitrine-${{ steps.checksum.outputs.version }}-sbom
          upload-artifact: false
          upload-release-assets: false

      # Immutable GitHub releases cannot be repaired after publication. Build the public
      # notes from the reviewed Keep a Changelog section rather than replacing that
      # narrative with an automatically generated commit list.
      - name: Prepare curated release notes
        env:
          VERSION: ${{ steps.checksum.outputs.version }}
        run: |
          set -euo pipefail
          NOTES_PATH="dist/release-notes.md"
          awk -v heading="## [${VERSION}]" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !started && $0 == "" { next }
            found { started = 1; print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "${NOTES_PATH}"
          if [ ! -s "${NOTES_PATH}" ] || ! grep -q '^### ' "${NOTES_PATH}"; then
            echo "::error::CHANGELOG.md has no curated release body for ${VERSION}."
            exit 1
          fi
          {
            echo "### Curated release notes"
            echo ""
            cat "${NOTES_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The tag run stops here. Nothing public, no appcast feed, no Homebrew tap,
      # and no website changes occur until a maintainer promotes this exact artifact.
      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-candidate-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.spdx.json
            dist/vitrine-cask-update.txt
            dist/appcast.xml
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Record promotion inputs
        env:
          VERSION: ${{ steps.checksum.outputs.version }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          {
            echo "### Candidate ready for external QA"
            echo ""
            echo "- Tag: \`${GITHUB_REF_NAME}\`"
            echo "- Candidate run ID: \`${GITHUB_RUN_ID}\`"
            echo "- DMG SHA-256: \`${SHA256}\`"
            echo "- Artifact: \`release-candidate-${GITHUB_REF_NAME}\` (retained for 30 days)"
            echo ""
            echo "Download this artifact on clean Sequoia and Tahoe Macs, run the documented"
            echo "activation and release QA checklist, and only then dispatch this workflow"
            echo "with the tag, run ID, SHA-256, and \`CLEAN-MAC-QA-PASSED\` confirmation."
          } >> "$GITHUB_STEP_SUMMARY"

  # Re-download the uploaded candidate on a fresh runner and run the same public
  # artifact checks a clean Mac will run. The Release tag workflow is successful
  # only if both the build runner and this independent runner accept the exact DMG.
  candidate-qa:
    name: QA uploaded release candidate
    if: github.event_name == 'push'
    needs: candidate
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download uploaded candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${GITHUB_RUN_ID}" \
            --name "release-candidate-${GITHUB_REF_NAME}" \
            --dir dist
          ls -l dist

      - name: Verify candidate manifest and checksum
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          DMG="dist/Vitrine-${VERSION}.dmg"
          for file in \
            "${DMG}" \
            "${DMG}.sha256" \
            "dist/Vitrine-${VERSION}.spdx.json" \
            "dist/vitrine-cask-update.txt" \
            "dist/appcast.xml" \
            "dist/release-notes.md"
          do
            if [ ! -s "${file}" ]; then
              echo "::error::Candidate artifact is missing ${file}."
              exit 1
            fi
          done
          ACTUAL_SHA256="$(shasum -a 256 "${DMG}" | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Uploaded candidate digest ${ACTUAL_SHA256} does not match build output ${EXPECTED_SHA256}."
            exit 1
          fi
          (cd dist && shasum -a 256 -c ./*.dmg.sha256)

      - name: Run candidate release QA suite
        run: ./scripts/qa-release.sh

  # Manual promotion is intentionally a separate workflow_dispatch run. It accepts
  # only a successful tag-triggered run of this exact workflow and exact tag commit,
  # then re-downloads and re-validates the candidate before creating any public state.
  publish:
    name: Promote vetted candidate to GitHub release
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate promotion request
        id: promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          QA_CONFIRMATION: ${{ inputs.qa_confirmation }}
        run: |
          set -euo pipefail
          TAG_OBJECT_TYPE="$(git cat-file -t "${RELEASE_TAG}" 2>/dev/null || true)"
          VERSION="${RELEASE_TAG#v}"
          MARKETING_VERSION="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([0-9][0-9A-Za-z.\-]*)"?[[:space:]]*$/\1/p' project.yml | head -n1)"
          TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}" 2>/dev/null || true)"
          RUN_JSON="${RUNNER_TEMP}/candidate-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" > "${RUN_JSON}"
          python3 scripts/verify-release-promotion.py \
            --tag "${RELEASE_TAG}" \
            --candidate-run-id "${CANDIDATE_RUN_ID}" \
            --expected-sha256 "${EXPECTED_SHA256}" \
            --qa-confirmation "${QA_CONFIRMATION}" \
            --tag-object-type "${TAG_OBJECT_TYPE}" \
            --tag-commit "${TAG_COMMIT}" \
            --marketing-version "${MARKETING_VERSION}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-json "${RUN_JSON}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${RELEASE_TAG} already exists; immutable releases are never overwritten."
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tag_commit=${TAG_COMMIT}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Promotion request validated"
            echo ""
            echo "- Tag: \`${RELEASE_TAG}\` at \`${TAG_COMMIT}\`"
            echo "- Successful candidate run: \`${CANDIDATE_RUN_ID}\`"
            echo "- Expected DMG SHA-256: \`${EXPECTED_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require distribution secrets before publication
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in TAP_DEPLOY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Promotion is missing required distribution secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Download vetted candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "${CANDIDATE_RUN_ID}" \
            --name "release-candidate-${RELEASE_TAG}" \
            --dir dist
          ls -l dist

      - name: Verify exact candidate before publication
        env:
          VERSION: ${{ steps.promotion.outputs.version }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          DMG="dist/Vitrine-${VERSION}.dmg"
          for file in \
            "${DMG}" \
            "${DMG}.sha256" \
            "dist/Vitrine-${VERSION}.spdx.json" \
            "dist/vitrine-cask-update.txt" \
            "dist/appcast.xml" \
            "dist/release-notes.md"
          do
            if [ ! -s "${file}" ]; then
              echo "::error::Promotion candidate is missing ${file}."
              exit 1
            fi
          done
          ACTUAL_SHA256="$(shasum -a 256 "${DMG}" | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Candidate digest ${ACTUAL_SHA256} does not match approved digest ${EXPECTED_SHA256}."
            exit 1
          fi
          (cd dist && shasum -a 256 -c ./*.dmg.sha256)

      - name: Run final pre-publication QA suite
        run: ./scripts/qa-release.sh

      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.spdx.json
            dist/vitrine-cask-update.txt
            dist/appcast.xml
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true

  # Validate the bytes downloaded from the public release before extending that
  # release to Homebrew, the production Sparkle feed, or the marketing site.
  published-qa:
    name: QA published release artifact
    if: github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Download published DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --pattern '*.dmg' \
            --pattern '*.dmg.sha256' \
            --dir dist
          ls -l dist

      - name: Verify published DMG is the approved candidate
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          DMG="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "${DMG}" ]; then
            echo "::error::Published release has no DMG."
            exit 1
          fi
          ACTUAL_SHA256="$(shasum -a 256 "${DMG}" | awk '{print $1}')"
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Published DMG digest ${ACTUAL_SHA256} differs from approved candidate ${EXPECTED_SHA256}."
            exit 1
          fi
          (cd dist && shasum -a 256 -c ./*.dmg.sha256)

      - name: Run published release QA suite
        run: ./scripts/qa-release.sh

  distribute:
    name: Publish Homebrew, Sparkle feed, and distribution metadata
    if: github.event_name == 'workflow_dispatch'
    needs: published-qa
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Download published distribution metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${RELEASE_TAG}" \
            --pattern 'appcast.xml' \
            --pattern 'vitrine-cask-update.txt' \
            --dir dist
          test -s dist/appcast.xml
          test -s dist/vitrine-cask-update.txt

      - name: Update the Homebrew tap cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          CASK_VERSION: ${{ inputs.tag }}
          CASK_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          CASK_VERSION="${CASK_VERSION#v}"
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "::error::TAP_DEPLOY_KEY disappeared after promotion preflight."
            exit 1
          fi
          ./scripts/update-homebrew-tap.sh \
            --kind cask \
            --name vitrine \
            --version "${CASK_VERSION}" \
            --sha256 "${CASK_SHA256}" \
            --template packaging/Casks/vitrine.rb

      - name: Stage production appcast and legacy redirect
        run: |
          set -euo pipefail
          mkdir -p _site
          cp dist/appcast.xml _site/appcast.xml
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Vitrine</title>' \
            '<link rel="canonical" href="https://vitrineframe.app/">' \
            '<meta name="robots" content="noindex">' \
            '<meta http-equiv="refresh" content="0; url=https://vitrineframe.app/">' \
            '<script>location.replace("https://vitrineframe.app/" + location.hash)</script>' \
            '<p>Vitrine has moved to <a href="https://vitrineframe.app/">vitrineframe.app</a>.</p>' \
            > _site/index.html

      - name: Upload appcast Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - name: Deploy appcast to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  deploy-site:
    name: Refresh the marketing site
    if: github.event_name == 'workflow_dispatch'
    needs: distribute
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
