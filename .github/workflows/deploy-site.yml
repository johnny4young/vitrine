name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published stable tag whose exact website source should deploy"
        required: true
        type: string
  workflow_call:
    inputs:
      release_ref:
        description: "Published stable tag whose exact website source should deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # Surface known vulnerabilities without failing the job. The site tree can carry an
      # advisory whose fix needs a deliberate upgrade, so a blocking audit would stop
      # unrelated work. The step tells a registry outage apart from findings rather than
      # reporting both as vulnerabilities, since `npm audit` exits non-zero for either.
      - name: Surface npm audit findings
        run: |
          set -uo pipefail
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" 2>/dev/null || true
          node -e '
            const fs = require("fs");
            let report = null;
            try { report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); } catch {}
            const counts = report && report.metadata && report.metadata.vulnerabilities;
            if (!counts) {
              console.log("::warning title=npm audit::npm audit produced no report, so vulnerabilities were not checked. The registry may be unreachable.");
            } else if (counts.high + counts.critical > 0) {
              console.log(`::warning title=npm audit::${counts.critical} critical and ${counts.high} high severity entries in site/. See the repository Dependabot alerts.`);
            } else {
              console.log(`npm audit: no high or critical findings (${counts.total} total).`);
            }
          ' "$RUNNER_TEMP/npm-audit.json"

      - name: Validate
        run: npm test

      # Main may contain unreleased website copy while project.yml still names the
      # previous stable version. Version equality alone therefore proves nothing about
      # provenance: pushes validate only, and production accepts an explicit stable tag
      # whose checked-out commit is exactly that tag's commit. The release workflow calls
      # this reusable workflow only after published-artifact QA and distribution succeed.
      - name: Verify exact website release provenance
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          # The script fails closed with a precise reason (missing key, or a version
          # the release tag guard would refuse), and `set -e` stops here, so there is
          # no empty-value branch left to write.
          VERSION="$(../scripts/project-version.sh --project ../project.yml)"

          if [ -z "${REQUESTED_REF}" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Source validated; production unchanged"
              echo ""
              echo "Pushes to main never deploy because main may contain unreleased copy."
              echo "Production accepts only an explicit published stable tag."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${REQUESTED_REF}" != "v${VERSION}" ]; then
            echo "::error::Requested website ref ${REQUESTED_REF} does not match MARKETING_VERSION v${VERSION}."
            exit 1
          fi
          if [ "$(git cat-file -t "${REQUESTED_REF}" 2>/dev/null || true)" != "tag" ]; then
            echo "::error::Website deployment requires the annotated tag ${REQUESTED_REF}."
            exit 1
          fi
          TAG_COMMIT="$(git rev-list -n 1 "${REQUESTED_REF}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "${HEAD_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "::error::Checked-out website commit ${HEAD_COMMIT} does not match ${REQUESTED_REF} at ${TAG_COMMIT}."
            exit 1
          fi

          PUBLISHED_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${VERSION}" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)"
          if [ "${PUBLISHED_TAG}" != "v${VERSION}" ]; then
            echo "::error::Website tag v${VERSION} has no matching published stable GitHub Release."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.release.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare Pages secrets are required for production deployment."
            exit 1
          fi
          npm exec -- wrangler pages deploy dist \
            --project-name=vitrine-web \
            --branch=main
