name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Coverage baseline · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: Sequoia 15
          - runner: macos-26
            platform: Tahoe 26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable
      - name: Export DEVELOPER_DIR
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
      - name: Install pinned XcodeGen
        run: ./scripts/install-xcodegen.sh
      - name: Capture pre-hardening coverage
        run: make test-coverage RESULT_BUNDLE="${RUNNER_TEMP}/baseline.xcresult"
      - name: Print production baseline
        run: |
          xcrun xccov view --report --json "${RUNNER_TEMP}/baseline.xcresult" > "${RUNNER_TEMP}/coverage.json"
          python3 - <<'PY'
          import json, os
          report = json.load(open(os.environ["RUNNER_TEMP"] + "/coverage.json"))
          names = {"Vitrine.app", "vitrine-cli", "VitrineMenuBarHelper"}
          targets = [target for target in report["targets"] if target["name"] in names]
          covered = sum(target["coveredLines"] for target in targets)
          executable = sum(target["executableLines"] for target in targets)
          print(json.dumps({
              "platform": "${{ matrix.platform }}",
              "covered": covered,
              "executable": executable,
              "productionLineCoverage": covered / executable,
              "targets": [{key: target[key] for key in ("name", "coveredLines", "executableLines")} for target in targets],
          }, sort_keys=True))
          PY
