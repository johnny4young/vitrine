name: Xcode 27 preview (non-required)

on:
  # This is an early-warning lane, not a pull-request or release gate. GitHub's
  # xcode-27 preview image pairs the preview Xcode and SDK with a host macOS that has
  # changed during the preview, so each run records the exact host in its summary.
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-27-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Lint, build & unit test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The image default is the preview Xcode this lane exists to exercise;
      # selecting latest-stable would skip it.
      - name: Set up macOS toolchain
        uses: ./.github/actions/setup-macos-toolchain
        with:
          summary-title: Preview toolchain
          summary-note: "This is early preview evidence on the host recorded above, not macOS 27 runtime certification."
          select-xcode: "false"

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      # The preview image cannot compile Vision's on-device text-recognition model
      # (e5rt_e5_compiler_compile fails), so these cases fail there on every run while they
      # pass on macos-26 and on Apple-silicon Macs with Xcode 27. They run apart and only warn.
      - name: Unit tests
        env:
          TEST_SKIP: >-
            VitrineTests/ImageTextExtractorTests/realRecognitionPreservesReadingOrderAndNormalizedBoxes()
            VitrineTests/ImageTextExtractorTests/blankImageReturnsNoText()
            VitrineTests/SmartInputTests/recognizesRenderedCodeText()
            VitrineTests/SmartInputTests/blankImageYieldsEmptyText()
        run: make test TEST_SKIP="${TEST_SKIP}"

      - name: On-device text recognition (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          TEST_ONLY: >-
            VitrineTests/ImageTextExtractorTests/realRecognitionPreservesReadingOrderAndNormalizedBoxes()
            VitrineTests/ImageTextExtractorTests/blankImageReturnsNoText()
            VitrineTests/SmartInputTests/recognizesRenderedCodeText()
            VitrineTests/SmartInputTests/blankImageYieldsEmptyText()
        run: |
          if ! make test TEST_ONLY="${TEST_ONLY}"; then
            echo "::warning title=On-device text recognition::Vision OCR failed on this preview image. The unit gate above excludes these cases; they still gate on macos-26."
            exit 1
          fi
