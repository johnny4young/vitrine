name: Xcode 27 preview (non-required)

on:
  # This is an early-warning lane, not a pull-request or release gate. GitHub's
  # xcode-27 preview image currently uses a macOS 26 host with the preview SDK.
  schedule:
    - cron: "0 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-27-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Lint, build & unit test
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The image default is the preview Xcode this lane exists to exercise;
      # selecting latest-stable would skip it.
      - name: Set up macOS toolchain
        uses: ./.github/actions/setup-macos-toolchain
        with:
          summary-title: Preview toolchain
          summary-note: "This is compile-time preview evidence on a macOS 26 host, not macOS 27 runtime certification."
          select-xcode: "false"

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Unit tests
        run: make test
