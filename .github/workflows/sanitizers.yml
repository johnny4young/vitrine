name: Sanitizers (non-required)

on:
  # Focused sanitizer runs are an early-warning lane while hosted-runner
  # stability is established. They deliberately do not run on PRs or pushes.
  schedule:
    - cron: "41 9 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: test-asan
            label: Address Sanitizer
            artifact: asan
          - target: test-tsan
            label: Thread Sanitizer
            artifact: tsan
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up macOS toolchain
        uses: ./.github/actions/setup-macos-toolchain
        with:
          summary-title: "${{ matrix.label }} toolchain"
          summary-note: "Focused non-required early warning; this is not full UI qualification."

      - name: Run focused sanitizer suite
        run: >-
          make ${{ matrix.target }}
          RESULT_BUNDLE="${RUNNER_TEMP}/${{ matrix.artifact }}.xcresult"

      - name: Upload sanitizer result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sanitizer-${{ matrix.artifact }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}.xcresult
          if-no-files-found: warn
